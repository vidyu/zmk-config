# Report the right half's battery to the host as a second Battery Service.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Max radio TX power (+8 dBm instead of 0) for a steadier link between the
# halves and to the host; costs some battery. Same as ZMK's Glove80 defconfig.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
